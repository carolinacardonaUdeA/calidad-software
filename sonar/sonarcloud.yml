# Workflow de GitHub Actions. Para activarlo copialo a .github/workflows/sonarcloud.yml
name: Calidad - pruebas + SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

env:
  SONAR_MAIN_BRANCH: ${{ vars.SONAR_MAIN_BRANCH || 'main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # Sonar necesita el historial completo para calcular "new code"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias + aceptacion (Karate) + cobertura + SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          # en push (rama main de GitHub) el analisis se publica en la rama principal de SonarCloud
          SONAR_BRANCH_ARG: ${{ github.event_name == 'push' && format('-Dsonar.branch.name={0}', env.SONAR_MAIN_BRANCH) || '' }}
        run: ./gradlew test acceptanceTest jacocoTestReport sonar --info $SONAR_BRANCH_ARG

      # Respaldo del Quality Gate propio (el plan gratuito no deja asignarlo al proyecto; en push la falta de datos cuenta como fallo):
      # topes de complejidad total y cobertura leidos de SonarCloud + complejidad por metodo con lizard.
      - name: Verificar umbrales de complejidad y cobertura
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_BRANCH: ${{ github.event_name == 'push' && env.SONAR_MAIN_BRANCH || '' }}
          SONAR_PULL_REQUEST: ${{ github.event_name == 'pull_request' && github.event.number || '' }}
          STRICT: ${{ github.event_name == 'push' && '1' || '0' }}
        run: |
          pip install --quiet lizard
          bash sonar/check-metrics.sh

      - name: Publicar reporte de Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: build/karate-reports
