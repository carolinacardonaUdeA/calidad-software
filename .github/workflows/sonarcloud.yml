# Workflow de GitHub Actions. Para activarlo copialo a .github/workflows/sonarcloud.yml
name: Calidad - pruebas + SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # Sonar necesita el historial completo para calcular "new code"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias + aceptacion (Karate) + cobertura + SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: ./gradlew clean test acceptanceTest jacocoTestReport sonar --info

      # Respaldo del Quality Gate propio (el plan gratuito no deja asignarlo al proyecto):
      # topes de complejidad total y cobertura leidos de SonarCloud + complejidad por metodo con lizard.
      - name: Verificar umbrales de complejidad y cobertura
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          pip install --quiet lizard
          bash sonar/check-metrics.sh

      - name: Publicar reporte de Karate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports
          path: build/karate-reports
